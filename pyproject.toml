[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lessondigest"
version = "0.1.0"
description = "Automatic transcription and structured summarization of a school lesson"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "markdown>=3.5"]
analytic = ["scikit-learn>=1.4", "razdel>=0.5", "pymorphy3>=2.0", "pymorphy3-dicts-ru", "networkx>=3.2"]
dev = ["pytest>=8.0"]

[project.scripts]
lessondigest = "lessondigest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
